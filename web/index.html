<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>힐링 농장</title>
    <link rel="stylesheet" href="/web/style.css" />
  </head>
  <body>
    <header>
      <h1>🌱 힐링 농장</h1>
      <span id="clock"></span>
      <span id="integrity-badge" class="badge" hidden>⚠ 무결성 이상: 저장이 잠겼어요</span>
      <span class="spacer"></span>
      <button id="idle-btn" class="ghost">🍃 멍때리기 <kbd>M</kbd></button>
      <span id="save-status"></span>
      <button id="save-btn">저장 <kbd>Ctrl+S</kbd></button>
      <button id="help-btn" class="ghost" aria-label="조작 방법">? </button>
    </header>
    <main>
      <section id="stage">
        <div id="farm-wrap">
          <canvas id="farm" aria-label="농장. 칸을 누르면 지금 도구로 일해요. 방향키로 칸을 고를 수 있어요."></canvas>
          <aside id="float-menu" hidden></aside>
        </div>
        <div id="toolbar" role="toolbar" aria-label="도구"></div>
      </section>
      <aside id="panel"></aside>
    </main>
    <div id="tip" hidden></div>
    <div id="help" hidden></div>
    <div id="toast" role="status"></div>
    <div id="loading" hidden>
      <div class="loading-box">
        <h2 id="loading-title">농장으로 가는 중…</h2>
        <div id="loading-progress" class="progress"><div id="loading-bar"></div></div>
        <ul id="loading-lines"></ul>
        <button id="loading-close" hidden>농장으로</button>
      </div>
    </div>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
